name: Feature request
description: Suggest a change to the Commander deckbuilding workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the deckbuilding task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to change?
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any other approaches you considered.
    validations:
      required: false
