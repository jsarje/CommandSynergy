name: CI

on:  
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.agents/**'
      - '.impeccable/**'
      - '.specify/**'
      - 'specs/**'
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOLUTION: src/CommandSynergy.slnx
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    name: Build, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@55ec9447dda3d1cf6bd587150f3262f30ee10815
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Configure NUGET packages folder        
        run: |
          echo "NUGET_PACKAGES=$HOME/.nuget/packages" >> $GITHUB_ENV

      - name: Cache NuGet packages
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Run tests
        run: |
          dotnet test ${{ env.SOLUTION }} -c Release --no-build --verbosity normal --filter "Category!=LocalOnly&Category!=Playwright" --logger "trx;LogFileName=TestResults.trx"

      - name: Install Playwright browsers
        run: pwsh tests/CommandSynergy.PlaywrightTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start web app
        run: |
          ASPNETCORE_ENVIRONMENT=Development DisableHttpsRedirection=true dotnet run --project src/CommandSynergy --configuration Release --no-build --urls http://127.0.0.1:5136 > "$RUNNER_TEMP/commandsynergy.log" 2>&1 &

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5136/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat "$RUNNER_TEMP/commandsynergy.log"
          exit 1

      - name: Run Playwright tests
        env:
          COMMANDSYNERGY_BASE_URL: http://127.0.0.1:5136/
        run: dotnet test tests/CommandSynergy.PlaywrightTests/CommandSynergy.PlaywrightTests.csproj -c Release --no-build --verbosity normal --filter "Category=Playwright" --logger "trx;LogFileName=PlaywrightTestResults.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-results-ubuntu-latest
          path: '**/TestResults/*.trx'  